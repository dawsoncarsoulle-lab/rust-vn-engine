[workspace]
members = [
    "rvn_parser",
    "rvn_graph",
    "rvn_ui",
    "rvn_media",
    "rvn_core",
    "rvn_bevy",
    "rvn_cli",
    "rvn_lsp",
    "rvn_native_source_binding",
]
resolver = "2"
exclude = ["vendor/ffmpeg-sys-next"]

[patch.crates-io]
ffmpeg-sys-next = { path = "vendor/ffmpeg-sys-next" }

[profile.dev]
opt-level = 1
