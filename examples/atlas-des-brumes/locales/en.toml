[strings]
"Il existe des îles que les cartes ont oubliées." = "There are islands that maps have forgotten."
"Chaque soir, la brume referme leurs chemins." = "Every evening, the mist closes their paths."
"Une lumière attend encore quelqu’un au port." = "A light at the harbour is still waiting for someone."
"La pierre se souvient du premier phare." = "The stone remembers the first lighthouse."
"Sa lumière ne chassait pas la brume : elle lui répondait." = "Its light did not drive the mist away. It answered it."
"L’Atlas s’ouvre à ceux qui écoutent." = "The Atlas opens to those who listen."
"La brume avale les routes, jamais les promesses. Ce soir, l’île vous a rendu son port." = "The mist swallows roads, never promises. Tonight, the island has given you back its harbour."
"Maëlys, gardienne du phare. Je garde les cartes que la mer refuse d’emporter." = "Maëlys, keeper of the lighthouse. I look after the maps the sea refuses to carry away."
"Vous êtes revenu avec une promesse tenue. Alors je peux vous confier le chemin." = "You came back with a promise kept. Now I can entrust you with the path."
"Je prends mon manteau. La forêt écoute les voix, mais elle reconnaît les lumières." = "I will fetch my coat. The forest listens to voices, but it recognises lights."
"Gardez cette lanterne près du cœur. La boussole indiquera où aller ; sa flamme vous dira quand." = "Keep this lantern close to your heart. The compass will tell you where to go; its flame will tell you when."
"Sans boussole, les passerelles semblent toutes mener au même reflet. Retournez au port chercher un cap." = "Without a compass, every walkway seems to lead to the same reflection. Return to the harbour and find your bearings."
"La boussole s’agite, mais aucun passage ne répond. Une lumière du phare pourrait réveiller les balises." = "The compass stirs, but no passage answers. A light from the lighthouse might wake the beacons."
"Vous posez la lanterne sur la première balise. Les trois suivantes s’allument, une à une ; la route est sûre." = "You set the lantern on the first beacon. The next three light up, one by one. The route is safe."
"La flamme dessine une courbe entre les balises. Là où elle passe, la forêt révèle une passerelle oubliée." = "The flame traces a curve between the beacons. In its wake, the forest reveals a forgotten walkway."
"Le phare n’était pas un rempart contre la brume. C’était une invitation à retrouver le monde." = "The lighthouse was not a wall against the mist. It was an invitation to rediscover the world."
"Dans la pierre, trois lignes rejoignent le port, la forêt et le temple. L’Atlas attend votre dernier choix." = "Three lines in the stone connect the harbour, the forest and the temple. The Atlas awaits your final choice."
"Mouvements réduits" = "Reduced motion"
"Contraste renforcé" = "High contrast"
"Lecture vocale" = "Self-voicing"
"Taille du texte" = "Text size"
"Prénom du cartographe" = "Cartographer’s first name"
"Nom du cartographe" = "Cartographer’s surname"
"Origine du cartographe" = "Cartographer’s origin"
"IDENTITÉ" = "IDENTITY"
"INVENTAIRE" = "INVENTORY"
"CARTE" = "MAP"
"Retour" = "Back"
"Prénom" = "First name"
"Nom" = "Surname"
"Les enfants du Rivage" = "Children of the Shore"
"Les Hautes Terres" = "The Highlands"
"Les voyageurs des Brumes" = "Travellers of the Mists"
"Explorer [atlas_location_name(atlas_location)]" = "Explore [atlas_location_name(atlas_location)]"
"Rouvrir l’Atlas" = "Open the Atlas again"
"Voir l’ouverture animée" = "Watch the animated opening"
"Lire les commandes" = "Read the controls"
"Dans l’Atlas : Q/E ou Page précédente/suivante changent de volet. Flèches et Entrée naviguent dans les objets et lieux. La souris sélectionne, survole et active." = "In the Atlas, Q/E or Page Up/Down switch pages. Arrow keys and Enter navigate items and places. Use the mouse to select, hover and activate."
"Échap ferme l’Atlas ; hors Atlas, Échap ouvre le menu système. F5/F6 sauvegardent et chargent rapidement hors Atlas. F8 ouvre les préférences accessibles du moteur." = "Escape closes the Atlas. Outside it, Escape opens the system menu. F5/F6 quick-save and quick-load outside the Atlas. F8 opens the engine’s accessibility preferences."
"Les noms, possessions, choix, puzzles, animations et positions du menu sont conservés dans les sauvegardes. Le rollback reste disponible pendant les dialogues." = "Saves preserve names, belongings, choices, puzzles, animations and menu positions. Rollback remains available during dialogue."
"[first_name] [last_name]… Un nom à inscrire dans l’Atlas. La brume a effacé cinq de nos routes. Aidez-moi à rallumer le phare." = "[first_name] [last_name]… A name to enter in the Atlas. The mist has erased five of our routes. Help me relight the lighthouse."
"Partager mes relevés avec Maëlys" = "Share my surveys with Maëlys"
"Alors nous voyagerons ensemble. Une carte appartient à toutes celles et ceux qui l’habitent." = "Then we will travel together. A map belongs to everyone who lives in it."
"Négocier une récompense" = "Negotiate a reward"
"Trente écus, et la même mission. La confiance se gagne en chemin." = "Thirty coins, and the same mission. Trust is earned along the way."
"Prenez cette lanterne et mon sceau. La Clairière cache un fragment ; les Archives sauront le lire. L’Observatoire est un détour qui peut nous aider." = "Take this lantern and my seal. A fragment is hidden in the glade; the Archives will know how to read it. A detour through the Observatory might help us."
"Le Havre vous accueille, [first_name]. Les marins ont reconnu le sceau accroché à votre sac." = "The harbour welcomes you, [first_name]. The sailors recognised the seal hanging from your bag."
"Se reposer — restaurer la vitalité" = "Rest — restore vitality"
"Acheter un élixir — 15 écus" = "Buy an elixir — 15 coins"
"Repartir" = "Set off again"
"Une passerelle cassée coupe la Clairière d’Azur. Au pied des racines, une malle porte un signe en forme de vent." = "A broken walkway cuts across the Azure Glade. At the foot of the roots, a chest bears a symbol shaped like the wind."
"Suivre la boussole" = "Follow the compass"
"L’aiguille s’aligne sur les pierres les plus sûres. Vous contournez le torrent sans vous blesser." = "The needle aligns with the safest stones. You make your way around the torrent unharmed."
"Tendre la corde" = "Stretch the rope across"
"Votre corde tendue entre deux branches vous fait traverser." = "Your rope, stretched between two branches, carries you across."
"Sauter de pierre en pierre" = "Jump from stone to stone"
"Une pierre glisse. Une égratignure, mais vous atteignez l’autre rive." = "A stone slips. You suffer a scratch, but reach the other bank."
"Votre saut est précis. Vous atteignez la malle, le sac encore sec." = "Your jump is precise. You reach the chest with your bag still dry."
"La malle renferme un grappin, un sifflet de terre cuite et le fragment recherché. Votre équipement ouvre maintenant la route des Falaises." = "The chest holds a grappling hook, a clay whistle and the fragment you sought. Your equipment now opens the way to the Cliffs."
"Le torrent murmure sous la passerelle. Le chemin est désormais sûr, et vos annotations restent dans le carnet." = "The torrent murmurs beneath the walkway. The route is safe now, and your notes remain in the journal."
"Votre lanterne révèle trois mots gravés : Lune2, Marée5, Vent1. Les anneaux de l’observatoire peuvent encore tourner." = "Your lantern reveals three engraved clues: Moon2, Tide5, Wind1. The Observatory’s rings can still turn."
"Les constellations se relient. Une lentille et une relique remontent du mécanisme ; vous avez appris à lire la mémoire de la brume." = "The constellations connect. A lens and a relic rise from the mechanism. You have learned to read the mist’s memory."
"Les anneaux gardent votre alignement. Le ciel paraît plus proche." = "The rings hold your alignment. The sky seems closer."
"Vous laissez les anneaux en silence. Les indices resteront là si vous revenez." = "You leave the rings in silence. The clues will still be there if you return."
"Le sceau de Maëlys ouvre les Archives. Vous placez le fragment dans la rainure d’une table d’obsidienne." = "Maëlys’s seal opens the Archives. You place the fragment in a groove on an obsidian table."
"Le monocle révèle une signature invisible : le phare n’était pas une arme, mais une promesse de retour." = "The monocle reveals an invisible inscription: the lighthouse was not a weapon, but a promise of return."
"Les archivistes déchiffrent les lignes estompées pour vous. Le phare guidait jadis tous les voyageurs." = "The archivists decipher the faded lines for you. The lighthouse once guided every traveller."
"Une clé ancienne sort de la table. Il manque seulement un cristal de lumière pour réveiller le phare : cherchez-le aux Falaises." = "An ancient key emerges from the table. Only a crystal of light is missing to wake the lighthouse. Look for it at the Cliffs."
"Votre sceau ouvre la porte, mais les archivistes demandent le fragment de la Clairière avant d’ouvrir le coffre." = "Your seal opens the door, but the archivists need the fragment from the glade before they can open the vault."
"Les archivistes classent vos relevés sous le nom [last_name]. La clé attend déjà dans votre sac." = "The archivists file your surveys under the name [last_name]. The key is already waiting in your bag."
"Le grappin mord la corniche. La lumière enfermée dans la roche répond à celle de votre lanterne." = "The grappling hook bites into the ledge. The light trapped in the rock answers your lantern."
"Vous recueillez deux cristaux. La carte révèle une dernière route vers la Tour du Veilleur." = "You gather two crystals. The map reveals one final route to the Watcher’s Tower."
"Le vent vous retient au pied des corniches. Posséder le grappin ne suffit pas : équipez-le dans l’inventaire, puis revenez." = "The wind holds you below the ledges. Owning the grappling hook is not enough: equip it in your inventory, then return."
"Vos cordages brillent le long de la falaise. La route est sûre pour les prochains voyageurs." = "Your ropes gleam along the cliff. The route is safe for the next travellers."
"La clé ouvre le socle du phare. Les deux cristaux se mettent à résonner. Vous pouvez canaliser leur lumière de deux façons." = "The key opens the lighthouse’s pedestal. The two crystals begin to resonate. You can channel their light in two ways."
"Partager la lumière avec les six routes" = "Share the light with all six routes"
"Écouter la mélodie du sifflet" = "Listen to the whistle’s melody"
"Rallumer le phare depuis la Tour" = "Relight the lighthouse from the Tower"
"Le phare continue de briller. L’aventure est achevée ; vous pouvez explorer librement les pages, les lieux et les souvenirs." = "The lighthouse keeps shining. The adventure is complete; you can freely explore its pages, places and memories."
"La lumière parcourt les six routes comme un trait d’encre vivante. La brume ne disparaît pas : elle devient un ciel pour celles et ceux qui voyagent." = "Light flows through the six routes like a stroke of living ink. The mist does not vanish. It becomes a sky for those who travel."
"[first_name] [last_name], cartographe du [origin], inscrit un dernier nom dans le carnet : Maëlys. Le vôtre reste à côté." = "[first_name] [last_name], cartographer from [origin], writes one last name in the journal: Maëlys. Yours remains beside it."
"Le phare perce la brume. Une seule lumière suffit pour que les bateaux trouvent de nouveau le Havre. Les autres routes attendront votre prochain voyage." = "The lighthouse pierces the mist. A single light is enough for the ships to find the harbour again. The other routes will await your next journey."
"Fin de L’Atlas des Brumes. Les choix, objets et détour par l’observatoire ont façonné cette conclusion. Le souvenir et la fin ont rejoint la galerie du moteur." = "The end of The Atlas of Mists. Your choices, belongings and detour through the Observatory shaped this conclusion. The memory and ending have been added to the engine’s gallery."
"Le jeu reste ouvert pour tester l’inventaire, la carte et les préférences. Sauvegarde, chargement, historique et rollback sont disponibles dans le menu système hors Atlas." = "The game stays open for you to try the inventory, map and preferences. Save, load, history and rollback are available in the system menu outside the Atlas."
"La forêt se referme dès les premières racines. Maëlys garde au Havre la lanterne capable de réveiller ces chemins." = "The forest closes in from its first roots. At the harbour, Maëlys keeps the lantern that can wake these paths."
"Le sifflet porte encore la mélodie de la forêt. Une troisième voie se dessine entre les deux cristaux." = "The whistle still carries the forest’s melody. A third way emerges between the two crystals."
"Votre signature a rejoint les archives des voyageurs, au-delà de cette partie." = "Your signature has joined the travellers’ archives, beyond this playthrough."
