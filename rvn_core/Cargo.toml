[package]
name = "rvn_core"
version = "0.1.0"
edition = "2024"

[dependencies]
rvn_parser = { path = "../rvn_parser" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Storage", "Window"] }
