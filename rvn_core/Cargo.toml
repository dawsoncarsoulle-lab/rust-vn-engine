[package]
name = "rvn_core"
version = "0.1.0"
edition = "2021"

[dependencies]
rvn_parser = { path = "../rvn_parser" }
rvn_ui = { path = "../rvn_ui" }
rvn_media = { path = "../rvn_media" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["float_roundtrip", "unbounded_depth"] }
sha2 = "0.10.9"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Storage", "Window"] }

[dev-dependencies]
rodio = { version = "=0.18.1", default-features = false, features = ["wav"] }
rvn_graph = { path = "../rvn_graph" }
