[package]
name = "r-blueprint"
version = "0.1.0"
edition = "2021"
authors = ["dawsoncarsoulle-lab"]
description = "A 100% Rust blueprint/node-graph framework inspired by Unreal Engine Blueprints"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["blueprint", "node-graph", "visual-scripting", "bevy", "gamedev"]
categories = ["game-development", "visualization"]

[dependencies]
# Core engine - Bevy 0.17 (LTS)
bevy = "0.17"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ron = "0.8"
bincode = "1.3"
base64 = "0.21"

# Math
glam = "0.25"

[dev-dependencies]
tempfile = "3.10"

[profile.dev]
opt-level = 1

[profile.dev.package.bevy]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[[example]]
name = "basic_blueprint"
path = "examples/basic_blueprint.rs"

[[example]]
name = "glass_effect"
path = "examples/glass_effect.rs"
