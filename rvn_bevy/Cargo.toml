[package]
name = "rvn_bevy"
version = "0.1.0"
edition = "2021"

[lib]
name = "rvn_bevy"
path = "src/lib.rs"

# The main executable has been removed in favour of a single `rvn` binary. All
# runtime functionality is now exposed via a library interface.

[dependencies]
rvn_parser        = { path = "../rvn_parser" }
rvn_core          = { path = "../rvn_core" }
bevy              = { version = "0.14", default-features = false, features = [
    "bevy_asset",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_sprite",
    "bevy_text",
    "bevy_ui",
    "bevy_winit",
    "bevy_audio",
    "bevy_state",    # <--- Add this line!
    "png",
    "jpeg",
    "vorbis",
    "default_font",
    "x11",
    "file_watcher",
    "multi_threaded",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
