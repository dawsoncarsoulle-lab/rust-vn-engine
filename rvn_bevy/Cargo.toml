[package]
name = "rvn_bevy"
version = "0.1.0"
edition = "2021"

[features]
video = ["dep:rvn_media"]

[lib]
name = "rvn_bevy"
path = "src/lib.rs"

[[bin]]
name = "rvn_bevy"
path = "src/main.rs"

[dependencies]
rvn_parser        = { path = "../rvn_parser" }
rvn_core          = { path = "../rvn_core" }
rvn_ui            = { path = "../rvn_ui" }
bevy_ecs = "0.14"
bevy_state = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# The same rasterizer already used by Bevy's Font assets; no second font stack.
ab_glyph = "0.2.32"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libloading = "0.8.9"
rvn_media = { path = "../rvn_media", features = ["video"], optional = true }
bevy = { version = "0.14", default-features = false, features = [
    "bevy_asset",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_sprite",
    "bevy_text",
    "bevy_ui",
    "bevy_winit",
    "bevy_audio",
    "bevy_state",
    "png",
    "jpeg",
    "webp",
    "vorbis",
    "wav",
    "mp3",
    "flac",
    "default_font",
    "x11",
    "file_watcher",
    "multi_threaded",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.14", default-features = false, features = [
    "bevy_asset",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_sprite",
    "bevy_text",
    "bevy_ui",
    "bevy_winit",
    "bevy_audio",
    "bevy_state",
    "png",
    "jpeg",
    "webp",
    "vorbis",
    "wav",
    "mp3",
    "flac",
    "default_font",
    "webgl2",
] }

console_error_panic_hook = "0.1"
getrandom = { version = "0.3", features = ["wasm_js"] }
js-sys = "0.3"
uuid = { version = "1", features = ["js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "console",
    "Response",
    "Storage",
    "Window",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.54", features = ["Win32_Media_Speech", "Win32_System_Com", "Win32_Globalization", "Win32_Foundation"] }
