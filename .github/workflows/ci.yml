name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (audio)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      # Historical style warnings are visible but not promoted to build errors.
      # Compilation errors, formatting and test failures remain blocking.
      - name: Clippy (workspace; existing warnings reported)
        run: cargo clippy --release --locked --workspace --all-targets

      - name: Build workspace
        run: cargo build --release --locked --workspace

      - name: Build WASM
        run: cargo build --release --locked -p rvn_bevy --target wasm32-unknown-unknown

      - name: Run tests
        run: cargo test --release --locked --workspace

      - name: Validate template project
        run: |
          ./target/release/rvn new /tmp/rvn_ci_demo
          ./target/release/rvn check /tmp/rvn_ci_demo
